<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 运行时 · 可点的最小产品</title>
<style>
  :root{--bg:#0b0d10;--panel:#0f141a;--fg:#e8ecf1;--dim:#98a2ad;--line:#232a33;--acc:#7cc4ff;--ok:#66d9a4;--bad:#ff7b72;--warn:#f2c14e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;height:100vh;display:flex}
  aside{width:300px;border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  h1{font-size:16px;margin:0}
  .sub{color:var(--dim);font-size:12px}
  .metric{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0;font-size:13px}
  .metric b{color:var(--acc);font-weight:600}
  label.toggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}
  #chat{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:76%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .user{align-self:flex-end;background:#1b2a3a;border:1px solid #2a4155}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .tool{align-self:flex-start;font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-family:ui-monospace,Consolas,monospace}
  .tool.ok{border-color:#25503f;color:#9fe3c4}
  .tool.err{border-color:#5a2a28;color:#ffb4ad}
  .guard{align-self:flex-start;font-size:12px;color:var(--warn);border:1px solid #4a3b1a;border-radius:8px;padding:5px 9px}
  .row{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
  input{flex:1;background:#0d1218;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:12px 14px;font-size:14px;outline:none}
  input:focus{border-color:#2e4a63}
  button{background:#16222e;border:1px solid #294056;color:#cfe6ff;border-radius:8px;padding:0 18px;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.retry{background:#2a1d16;border-color:#5a3a24;color:#ffc9a8;padding:6px 12px;font-size:12px;margin-top:8px}
  .hint{color:var(--dim);font-size:12px;line-height:1.5}
  .pos{color:var(--ok)}
</style>
</head>
<body>
<aside>
  <div>
    <h1>Agent 运行时</h1>
    <div class="sub">流式 · 工具调用 · 守卫 · 重试</div>
  </div>

  <div>
    <div class="sub" style="margin-bottom:6px">指标（本进程实时）</div>
    <div class="metric"><span>轮次</span><b id="m-turns">0</b></div>
    <div class="metric"><span>工具调用</span><b id="m-tools">0</b></div>
    <div class="metric"><span>守卫拦截</span><b id="m-guard">0</b></div>
    <div class="metric"><span>错误</span><b id="m-err">0</b></div>
    <div class="metric"><span>重试</span><b id="m-retry">0</b></div>
    <div class="metric"><span>输出字符</span><b id="m-tokens">0</b></div>
    <div class="metric"><span>P95 延迟</span><b id="m-p95">0ms</b></div>
  </div>

  <label class="toggle"><input type="checkbox" id="fault"> 注入工具失败（看点重试）</label>

  <div class="hint">
    试一试：<br>
    · 「北京天气怎么样」→ 工具调用<br>
    · 「帮我算 12*38+7」→ 计算工具<br>
    · 「随便聊聊」→ 纯回复<br>
    勾上"注入失败"再发，会看到错误卡 + 重试按钮。
  </div>
</aside>

<main>
  <div id="chat"></div>
  <div class="row">
    <input id="q" placeholder="说点什么…（Enter 发送）" autofocus>
    <button id="send">发送</button>
  </div>
</main>

<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const sendBtn = document.getElementById('send');
const fault = document.getElementById('fault');
let sessionId = 's-' + Math.random().toString(36).slice(2, 8);
let currentBot = null;

function el(cls, text) { const d = document.createElement('div'); d.className = cls; if (text) d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }

async function refreshMetrics() {
  try {
    const m = await (await fetch('/api/metrics')).json();
    document.getElementById('m-turns').textContent = m.turns;
    document.getElementById('m-tools').textContent = m.toolCalls;
    document.getElementById('m-guard').textContent = m.guardHits;
    document.getElementById('m-err').textContent = m.errors;
    document.getElementById('m-retry').textContent = m.retries;
    document.getElementById('m-tokens').textContent = m.tokens;
    document.getElementById('m-p95').textContent = (m.p95 || 0) + 'ms';
  } catch {}
}
setInterval(refreshMetrics, 1200); refreshMetrics();

async function send(text) {
  el('msg user', text);
  currentBot = el('msg bot', '');
  const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId, text, injectFail: fault.checked }) });
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (block.match(/^event: (.*)$/m) || [])[1];
      const dataLine = (block.match(/^data: (.*)$/m) || [])[1] || '{}';
      const data = JSON.parse(dataLine);
      if (ev === 'tool_call') el('tool', `→ 调用工具 ${data.name}：${data.desc}`);
      if (ev === 'tool_result') el('tool ' + (data.ok ? 'ok' : 'err'), data.ok ? `✓ ${data.name} → ${data.data}` : `✗ ${data.name} → ${data.error}`);
      if (ev === 'guard') el('guard', `守卫拦截：${data.hits.join('、')}（已替换为安全话术）`);
      if (ev === 'delta') { currentBot.textContent += data.text; chat.scrollTop = chat.scrollHeight; }
      if (ev === 'done') { if (data.guarded) el('guard', '本轮命中守卫'); }
      if (ev === 'error') el('tool err', '错误：' + data.message);
      if (ev === 'error' || (ev === 'done' && fault.checked)) addRetry();
    }
  }
  refreshMetrics();
}
function addRetry() {
  const b = document.createElement('button');
  b.className = 'retry'; b.textContent = '重试这一轮';
  b.onclick = async () => { await fetch('/api/retry', { method: 'POST' }); send('重试一次'); b.remove(); };
  chat.appendChild(b); chat.scrollTop = chat.scrollHeight;
}
sendBtn.onclick = () => { const t = q.value.trim(); if (!t) return; q.value = ''; send(t); };
q.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.onclick(); });

// 演示模式：?demo=1 自动跑三段（工具 / 守卫 / 失败重试）
if (new URLSearchParams(location.search).has('demo')) {
  setTimeout(() => send('北京天气怎么样'), 300);
  setTimeout(() => send('用客服口气回我'), 1500);
  setTimeout(() => { fault.checked = true; send('算一下 12*38+7'); }, 2700);
}
</script>
</body>
</html>
